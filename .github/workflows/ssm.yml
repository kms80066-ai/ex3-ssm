# 워크플로우(작업) 이름
name: GitOps CI Pipeline
# 1. 트리거 설정: 브랜치 정의
on:
  push:
    branches:
    - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest  # 실제 작업 주체
    
    # 작업 절차
    steps:
    - name: 소스코드 전송
      uses: actions/checkout@v4
    
    - name: AWS 자격 증명 설정
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
        aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
        aws-region: ${{secrets.AWS_REGION}}

    - name: S3에서 프라이빗으로 배포
      run: |
        # 전체 동기화, 소스 데이터 S3 버킷으로 업로드
        aws s3 sync ./html/ s3://bipa17-std09-cicd-925047940866-ca-central-1-website/ --delete
        
        aws ssm send-command \
          --instance-ids "i-07ffa4cd292129532" \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[
          \"sudo aws s3 sync s3://bipa17-std09-cicd-925047940866-ca-central-1-website/ /usr/share/nginx/html/ --delete\",
          \"sudo chown -R ec2-user:nginx /usr/share/nginx/html\",
          \"sudo systemctl reload nginx\"
          ]" \
          --region ${{secrets.AWS_REGION}}
          --comment "Deploying SSM"